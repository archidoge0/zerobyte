name: Install dependencies

description: Install dependencies

runs:
  using: "composite"
  steps:
    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
      name: Install Bun
      with:
        bun-version: "1.3.6"

    - name: Install dependencies
      shell: bash
      run: bun install --frozen-lockfile
