name: "ghav human: Checks"
"on":
  push:
    branches:
      - ghav/dev/577
    paths:
      - .ghav/human
permissions:
  contents: read
jobs:
  lint:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - name: Install dependencies
        uses: ./.github/actions/install-dependencies
      - uses: oxc-project/oxlint-action@latest
        with:
          config: .oxlintrc.json
          deny-warnings: true
          version: 1.50.0
  typecheck:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - name: Install dependencies
        uses: ./.github/actions/install-dependencies
      - name: Run type checks
        shell: bash
        run: bun run tsc
  test-server:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - name: Install dependencies
        uses: ./.github/actions/install-dependencies
      - name: Run server tests
        shell: bash
        run: bun run test:server
  test-client:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - name: Install dependencies
        uses: ./.github/actions/install-dependencies
      - name: Run client tests
        shell: bash
        run: bun run test:client
  build:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - name: Install dependencies
        uses: ./.github/actions/install-dependencies
      - name: Build project
        shell: bash
        run: bun run build
